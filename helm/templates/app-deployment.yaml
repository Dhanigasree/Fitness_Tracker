apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-tracker-app
  namespace: {{ .Values.namespace | default "fitness-ns" }}
spec:
  replicas: {{ .Values.replicaCount | default 2 }}
  selector:
    matchLabels:
      app: fitness-tracker-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        app: fitness-tracker-app
      annotations:
        ad.datadoghq.com/fitness-tracker-app.logs: >-
          [{"source":"nodejs","service":"fitness-tracker-service"},
           {"source":"nodejs","service":"fitness-tracker-app"}]
    spec:
      containers:
        - name: fitness-tracker-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 5000
          resources:
            requests: 
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
          # ✔ All configMap vars removed
          # ✔ Direct env variables added
          env:
          #   - name: MONGODB_URI
          #     value: "mongodb://mongodb-service:27017/fitness-tracker"
          #   - name: PORT
          #     value: "5000"
          #   - name: HOST
          #     value: "0.0.0.0"
          #   - name: NODE_ENV
          #     value: "production"
            # Datadog APM (tracing) env variables
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecrets.targetSecretName | quote }}
                  key: {{ .Values.externalSecrets.keys.mongodbUri | quote }}
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: fitness-configmap
                  key: PORT
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: fitness-configmap
                  key: HOST
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: fitness-configmap
                  key: NODE_ENV
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              value: "8126"
            - name: DD_ENV
              value: {{ .Values.datadog.env | quote }}
            - name: DD_SERVICE
              value: {{ .Values.datadog.service | quote }}
            - name: DD_VERSION
              value: {{ .Values.datadog.version | quote }}
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecrets.targetSecretName | quote }}
                  key: {{ .Values.externalSecrets.keys.datadogApiKey | quote }}
---

apiVersion: v1
kind: Service
metadata:
  name: fitness-tracker-service
  namespace: {{ .Values.namespace | default "fitness-ns" }}
spec:
  selector:
    app: fitness-tracker-app
  ports:
  - port: 80
    targetPort: 5000
  type: ClusterIP
