name: Fitness CI Pipeline
on:
  push:
    branches:
      - master
env:
  IMAGE_NAME: fitness-app-image
  tag: v1.1.0
  SONAR_TOKEN: {{ secrets.SONAR_TOKEN }}
jobs:
  build-scan-push:  
    runs-on: ubuntu-latest

    steps:
    - name: Clone Repo
      uses: actions/checkout@v4
    - name: SonarQube
      uses: SonarSource/sonarqube-scan-action@v2
    - name: Setup Docker 
      uses: docker/setup-buildx-action@v3
    - name: Docker Hub login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.tag }} .
    - name: Trivy Install
      run: |
        sudo apt update
        sudo apt install trivy -y
    - name: Scan Image
      run: trivy image --severity HIGH,CRITICAL ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.tag }}
    - name: Push Docker Image
      if: github.ref == 'refs/heads/master'
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.tag }}