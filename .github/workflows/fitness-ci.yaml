name: Fitness CI Pipeline
on:
  push:
    branches:
      - master
env:
  IMAGE_NAME: fitness-app-image
  tag: v1.1.0
jobs:
  build-scan-push:  
    runs-on: ubuntu-latest

    steps:
    - name: Clone Repo
      uses: actions/checkout@4
    - name: Setup Docker 
      uses: docker/setup-buildx-action@v3
    - name: Docker Hub login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/$${{ env.IMAGE_NAME }}:${{ env.tag }}
    - name: Scan Image
      uses: aquasecurity/trivy-actions@vv0.20.0
      with:
        image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.tag }}
        format: table
        exit-code: 0
        severity: CRITICAL,HIGH
    - name: Push Docker Image
      if: github.ref == 'refs/heads/master'
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.tag }}